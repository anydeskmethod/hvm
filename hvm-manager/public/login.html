<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in \u2014 HVM Manager</title>
  <link rel="icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="brand">
        <img src="/img/logo.svg" width="34" height="34" onerror="this.style.display='none'" />
        <span class="brand-name" style="font-size:18px" id="panelName">HVM Manager</span>
      </div>
      <h2>Sign in to your panel</h2>
      <form id="loginForm">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" required />
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
        <button type="submit" class="btn-primary">Sign in</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script>
    fetch('/api/settings').then(r => r.json()).then(s => {
      if (s.panel_name) { document.getElementById('panelName').textContent = s.panel_name; document.title = 'Sign in \u2014 ' + s.panel_name; }
      if (s.accent_color) document.documentElement.style.setProperty('--accent', s.accent_color);
    }).catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
