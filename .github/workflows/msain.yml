name: Move hvm-manager contents to root

on:
  workflow_dispatch: # This allows you to manually trigger the workflow from the Actions tab
  push:
    branches:
      - main
    paths:
      - 'hvm-manager/**' # Only runs if you make changes to the hvm-manager folder

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to let the action push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move contents to root
        run: |
          # Move all files AND hidden files (like .env, .gitignore) from hvm-manager to root
          shopt -s dotglob
          mv hvm-manager/* .
          
          # Remove the now-empty hvm-manager directory
          rmdir hvm-manager

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Check if there are changes to commit, to prevent workflow failure
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git commit -m "chore: move hvm-manager contents to root"
            git push
          else
            echo "No changes to commit"
          fi
