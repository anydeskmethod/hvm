<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel</title>
  <link rel="icon" href="/img/favicon.ico" />
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const ctx = await renderShell('admin');
      if (!ctx) return;
      if (ctx.me.role !== 'admin') {
        document.getElementById('main-content').innerHTML = `<div class="empty-state">Admins only.</div>`;
        return;
      }
      const main = document.getElementById('main-content');

      main.innerHTML = `
        <div class="topbar">
          <div><h1>Admin Panel</h1><div class="subtitle">Create VPS instances, assign them to users, manage the cluster.</div></div>
          <button class="btn-primary" id="createBtn">+ New VPS</button>
        </div>
        <div class="grid cols-4 section" id="overviewCards"></div>
        <div class="section">
          <h2>All VPS</h2>
          <table>
            <thead><tr><th>Name</th><th>Owner</th><th>Resources</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="vpsTableBody"></tbody>
          </table>
        </div>
      `;

      document.getElementById('createBtn').onclick = openCreateModal;

      const [overview, users] = await Promise.all([
        api.get('/api/admin/overview'),
        api.get('/api/admin/users')
      ]);

      document.getElementById('overviewCards').innerHTML = `
        <div class="card stat-card"><div class="stat-label">Total VPS</div><div class="stat-value">${overview.totalVps}</div></div>
        <div class="card stat-card"><div class="stat-label">Running</div><div class="stat-value">${overview.running}</div></div>
        <div class="card stat-card"><div class="stat-label">Unassigned</div><div class="stat-value">${overview.unassigned}</div></div>
        <div class="card stat-card"><div class="stat-label">Total Users</div><div class="stat-value">${overview.totalUsers}</div></div>
      `;

      async function loadVpsTable() {
        const list = await api.get('/api/admin/vps');
        const userOptions = (u) => users.map(x => `<option value="${x.id}" ${x.id === u ? 'selected' : ''}>${escapeHtml(x.username)}</option>`).join('');

        document.getElementById('vpsTableBody').innerHTML = list.map(v => `
          <tr>
            <td><a href="/vps.html?id=${v.id}">${escapeHtml(v.name)}</a><div class="text-muted" style="font-size:11px">${escapeHtml(v.container_name || '')}</div></td>
            <td>
              <select onchange="assignVps(${v.id}, this.value)" style="width:140px">
                <option value="">\u2014 unassigned \u2014</option>
                ${userOptions(v.owner_id)}
              </select>
            </td>
            <td class="text-muted">RAM ${v.ram_mb}MB \u00b7 CPU ${v.cpu_cores}</td>
            <td><span class="badge ${v.status}">${v.status}</span></td>
            <td class="flex gap-8">
              <button class="btn-sm" onclick="renameAdminVps(${v.id}, '${escapeAttr(v.name)}')">Rename</button>
              <button class="btn-sm btn-danger" onclick="deleteVps(${v.id})">Delete</button>
            </td>
          </tr>
        `).join('') || `<tr><td colspan="5" class="empty-state">No VPS created yet.</td></tr>`;
      }
      await loadVpsTable();

      window.assignVps = async (id, ownerId) => {
        try {
          await api.patch(`/api/admin/vps/${id}/assign`, { ownerId: ownerId || null });
        } catch (err) { alert(err.message); }
      };

      window.renameAdminVps = async (id, current) => {
        const name = prompt('New name:', current);
        if (!name) return;
        await api.patch(`/api/admin/vps/${id}/rename`, { name });
        loadVpsTable();
      };

      window.deleteVps = async (id) => {
        if (!confirm('Delete this VPS and its container permanently?')) return;
        try {
          await api.del(`/api/admin/vps/${id}`);
          loadVpsTable();
        } catch (err) { alert(err.message); }
      };

      function openCreateModal() {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
          <div class="modal">
            <h3>Create new VPS</h3>
            <div class="text-muted" style="font-size:12px">Provisions a real Docker container on this host.</div>
            <label>Name</label>
            <input id="mName" placeholder="e.g. node-01" />
            <label>Image</label>
            <input id="mImage" value="ubuntu:22.04" />
            <label>RAM (MB)</label>
            <input id="mRam" type="number" value="1024" />
            <label>CPU cores</label>
            <input id="mCpu" type="number" step="0.5" value="1" />
            <label>Assign to</label>
            <select id="mOwner">
              <option value="">\u2014 unassigned \u2014</option>
              ${users.map(u => `<option value="${u.id}">${escapeHtml(u.username)}</option>`).join('')}
            </select>
            <div class="modal-actions">
              <button id="mCancel">Cancel</button>
              <button class="btn-primary" id="mCreate">Create</button>
            </div>
          </div>
        `;
        document.body.appendChild(backdrop);
        backdrop.querySelector('#mCancel').onclick = () => backdrop.remove();
        backdrop.querySelector('#mCreate').onclick = async () => {
          const name = backdrop.querySelector('#mName').value.trim();
          if (!name) return alert('Name required');
          const btn = backdrop.querySelector('#mCreate');
          btn.disabled = true; btn.textContent = 'Creating\u2026';
          try {
            await api.post('/api/admin/vps', {
              name,
              image: backdrop.querySelector('#mImage').value.trim() || 'ubuntu:22.04',
              ramMb: Number(backdrop.querySelector('#mRam').value) || 1024,
              cpuCores: Number(backdrop.querySelector('#mCpu').value) || 1,
              ownerId: backdrop.querySelector('#mOwner').value || null
            });
            backdrop.remove();
            loadVpsTable();
            const ov = await api.get('/api/admin/overview');
            document.getElementById('overviewCards').innerHTML = `
              <div class="card stat-card"><div class="stat-label">Total VPS</div><div class="stat-value">${ov.totalVps}</div></div>
              <div class="card stat-card"><div class="stat-label">Running</div><div class="stat-value">${ov.running}</div></div>
              <div class="card stat-card"><div class="stat-label">Unassigned</div><div class="stat-value">${ov.unassigned}</div></div>
              <div class="card stat-card"><div class="stat-label">Total Users</div><div class="stat-value">${ov.totalUsers}</div></div>
            `;
          } catch (err) {
            alert(err.message);
            btn.disabled = false; btn.textContent = 'Create';
          }
        };
      }
    })();
  </script>
</body>
</html>
